name: 'Test Ubuntu'
description: 'Run tests on Ubuntu with coverage reporting'

inputs:
  codecov-token:
    description: 'Codecov token for uploading coverage reports'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Report Ubuntu runner hardware
      shell: bash
      run: |
        echo "Architecture: $(uname -m)"
        echo "Available CPUs: $(nproc)"
        lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket):'
        free -h

    - name: Build svZeroDSolver
      shell: bash
      run: |
        conda init
        source /conda/etc/profile.d/conda.sh
        conda activate svmultiphysics
        git clone https://github.com/SimVascular/svZeroDSolver.git
        cd svZeroDSolver
        mkdir build
        cd build
        cmake_args=()
        if [ "$SVMP_OPTIMIZED_CI" = true ]; then
          cmake_args+=(-DCMAKE_BUILD_TYPE=Release)
        fi
        cmake .. "${cmake_args[@]}" \
          -DCMAKE_PROJECT_svZeroDSolver_INCLUDE="$GITHUB_WORKSPACE/Code/ThirdParty/eigen/share/eigen3/cmake/Eigen3Config.cmake" \
          -DFETCHCONTENT_SOURCE_DIR_EIGEN="$GITHUB_WORKSPACE/Code/ThirdParty/eigen"
        make -j"$(nproc)"
        
    - name: Build svMultiPhysics
      shell: bash
      run: |
        if [ -d "build" ]; then
          rm -rf "build"
        fi
        mkdir build
        cd build
        cmake_args=(-DENABLE_COVERAGE=ON -DENABLE_ARRAY_INDEX_CHECKING=ON)
        if [ "$SVMP_OPTIMIZED_CI" = true ]; then
          cmake_args=(-DCMAKE_BUILD_TYPE=Release -DENABLE_COVERAGE=OFF -DENABLE_ARRAY_INDEX_CHECKING=OFF)
        fi
        cmake "${cmake_args[@]}" -DENABLE_UNIT_TEST=ON -DSV_USE_TRILINOS:BOOL=ON ..
        make -j"$(nproc)"
        cd ..
        
    - name: Build svMultiPhysics (PETSc)
      shell: bash
      run: |
        if [ -d "build-petsc" ]; then
          rm -rf "build-petsc"
        fi
        mkdir build-petsc
        cd build-petsc
        cmake_args=(-DENABLE_COVERAGE=ON -DENABLE_ARRAY_INDEX_CHECKING=ON)
        if [ "$SVMP_OPTIMIZED_CI" = true ]; then
          cmake_args=(-DCMAKE_BUILD_TYPE=Release -DENABLE_COVERAGE=OFF -DENABLE_ARRAY_INDEX_CHECKING=OFF)
        fi
        cmake "${cmake_args[@]}" -DENABLE_UNIT_TEST=ON -DSV_PETSC_DIR:STRING=/petsc ..
        make -j"$(nproc)"
        cd ..
        
    - name: Run integration tests
      shell: bash
      run: |
        git config --global --add safe.directory /__w/svMultiPhysics/svMultiPhysics
        git lfs pull
        cd tests
        conda run -n svmultiphysics pytest -v -rfEP --durations=0
        
    - name: Run unit tests
      shell: bash
      run: |
        cd build/svMultiPhysics-build/Source/solver
        ctest --verbose
        
    - name: Generate code coverage
      if: ${{ env.SVMP_OPTIMIZED_CI != 'true' }}
      shell: bash
      run: |
        cd build/svMultiPhysics-build
        make coverage
        
    - name: Save coverage report
      if: ${{ env.SVMP_OPTIMIZED_CI != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage_report
        path: build/svMultiPhysics-build/coverage
        
    - name: Upload coverage reports to Codecov
      if: ${{ env.SVMP_OPTIMIZED_CI != 'true' }}
      uses: codecov/codecov-action@v5
      env:
        CODECOV_TOKEN: ${{ inputs.codecov-token }}
