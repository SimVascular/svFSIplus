name: 'Test macOS'
description: 'Run tests on macOS with all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Report macOS runner hardware
      shell: bash
      run: |
        echo "Architecture: $(uname -m)"
        echo "Hardware model: $(sysctl -n hw.model)"
        echo "Physical CPUs: $(sysctl -n hw.physicalcpu)"
        echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
        echo "Memory (bytes): $(sysctl -n hw.memsize)"
        system_profiler SPHardwareDataType | awk '/Chip:|Processor Name:|Total Number of Cores:/ { print }'

    - name: Install macOS dependencies
      shell: bash
      run: |
        brew reinstall -v gcc
        brew install -v vtk openblas lapack mesa open-mpi qt
        if [ "$SVMP_OPTIMIZED_CI" != true ]; then
          brew install lcov
        fi
        sudo ln -s /usr/local/opt/qt5/mkspecs /usr/local/mkspecs
        sudo ln -s /usr/local/opt/qt5/plugins /usr/local/plugins
        
    - name: Install Miniconda
      shell: bash
      run: |
        curl -O https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh
        bash Miniconda3-latest-MacOSX-x86_64.sh -b -p $HOME/miniconda
        echo "$HOME/miniconda/bin" >> $GITHUB_PATH
        
    - name: Build svZeroDSolver
      shell: bash
      run: |
        git clone https://github.com/SimVascular/svZeroDSolver.git
        cd svZeroDSolver
        mkdir build
        cd build
        cmake_args=()
        if [ "$SVMP_OPTIMIZED_CI" = true ]; then
          cmake_args+=(-DCMAKE_BUILD_TYPE=Release)
        fi
        cmake .. "${cmake_args[@]}" \
          -DCMAKE_PROJECT_svZeroDSolver_INCLUDE="$GITHUB_WORKSPACE/Code/ThirdParty/eigen/share/eigen3/cmake/Eigen3Config.cmake" \
          -DFETCHCONTENT_SOURCE_DIR_EIGEN="$GITHUB_WORKSPACE/Code/ThirdParty/eigen"
        make -j"$(sysctl -n hw.physicalcpu)"
        
    - name: Build svMultiPhysics
      shell: bash
      run: |
        mkdir build
        cd build
        cmake_args=(-DENABLE_COVERAGE=ON -DENABLE_ARRAY_INDEX_CHECKING=ON)
        if [ "$SVMP_OPTIMIZED_CI" = true ]; then
          cmake_args=(-DCMAKE_BUILD_TYPE=Release -DENABLE_COVERAGE=OFF -DENABLE_ARRAY_INDEX_CHECKING=OFF)
        fi
        cmake "${cmake_args[@]}" -DENABLE_UNIT_TEST=ON ..
        make -j"$(sysctl -n hw.physicalcpu)"
        
    - name: Install test dependencies
      shell: bash
      run: |
        conda create -n svmultiphysics python=3.9
        conda run -n svmultiphysics pip install pytest pytest-cov pytest-mock numpy meshio pandas
        
    - name: Run integration tests
      shell: bash
      run: |
        git lfs pull
        cd tests
        pytest_args=(-v -rfEP --durations=0)
        if [ "${SVMP_PARALLEL_INTEGRATION_TESTS:-false}" = true ]; then
          conda run -n svmultiphysics pip install pytest-xdist
          echo "Running rank-1 tests with 2 workers"
          SVMP_TEST_PROCS=1 conda run -n svmultiphysics pytest "${pytest_args[@]}" -n 2 --dist=loadfile
          echo "Running rank-3 tests with 2 workers"
          SVMP_TEST_PROCS=3 conda run -n svmultiphysics pytest "${pytest_args[@]}" --ignore=test_shell.py -n 2 --dist=loadfile
        else
          conda run -n svmultiphysics pytest "${pytest_args[@]}"
        fi
        
    - name: Run unit tests
      shell: bash
      run: |
        cd build/svMultiPhysics-build/Source/solver
        ctest --verbose
